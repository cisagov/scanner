---
# This Docker composition file is used to build and test the container

name: scanner

secrets:
  aws_config:
    file: ./src/secrets/aws_config

services:
  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-gatherer-dev-only}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-gatherer-dev-only}
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    image: redis:alpine

  scanner:
    # Run the container normally
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AWS_CONFIG_FILE: /run/secrets/aws_config
      # Setting this environment variable ensures that the config file
      # (and not just any credentials file that is present) is loaded.
      AWS_SDK_LOAD_CONFIG: 1
      REDISCLI_AUTH: ${REDIS_PASSWORD:-gatherer-dev-only}
    image: cisagov/scanner
    init: true
    restart: "no"
    secrets:
      - source: aws_config
        target: aws_config
